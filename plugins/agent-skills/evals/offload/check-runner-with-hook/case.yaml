schema_version: "1.1"
name: offload-check-runner-with-hook
tags: [offload]
runs: 3
plugins: ["../../.."]
context:
  scaffold_script: scaffold.sh
execution:
  env:
    EVAL_OFFLOAD_HOOK: "on"
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: Run the full test suite of this project (it takes over a minute) and tell me what is failing and why.
