schema_version: "1.1"
name: offload-implementer-with-hook
tags: [offload]
runs: 3
plugins: ["../../.."]
context:
  scaffold_script: scaffold.sh
execution:
  env:
    EVAL_OFFLOAD_HOOK: "on"
  max_turns: 14
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Edit, Write]
  # The decision and the off-limits file live only in this conversation: the brief must carry them (ADR 0013).
  prompt: |
    Implement Task 2 of docs/plan.md. One decision from our earlier talk: round to cents only once, in total(), because invoice.py already rounds each line and rounding twice drifted totals by a cent. Leave invoice.py alone, the billing team owns it.
