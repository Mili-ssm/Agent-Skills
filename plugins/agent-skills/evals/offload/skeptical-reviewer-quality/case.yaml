schema_version: "1.1"
name: offload-skeptical-reviewer-quality
tags: [offload]
runs: 3
plugins: ["../../.."]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 14
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: I just added `dedupe.py` and `labels.py` and their tests; `python3 -m unittest discover -s tests` passes. Review that change with the skeptical-reviewer agent, then tell me what you would rework before delivering, if anything.
