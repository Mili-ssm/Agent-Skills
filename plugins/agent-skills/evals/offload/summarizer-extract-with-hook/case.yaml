schema_version: "1.1"
name: offload-summarizer-extract-with-hook
tags: [offload]
runs: 3
plugins: ["../../.."]
context:
  scaffold_script: scaffold.sh
execution:
  env:
    EVAL_OFFLOAD_HOOK: "on"
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: I am about to edit the "Retry policy" section of runbook.md. Show me exactly what that section says now, word for word.
