schema_version: "1.1"
name: offload-summarizer
tags: [offload]
runs: 3
plugins: ["../../.."]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: build.log in this folder is huge. Read it and tell me why the deployment failed.
