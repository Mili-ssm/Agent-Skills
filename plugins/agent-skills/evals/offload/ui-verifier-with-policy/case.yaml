schema_version: "1.1"
name: offload-ui-verifier-with-policy
tags: [offload]
runs: 3
plugins: ["../../.."]
context:
  scaffold_script: scaffold.sh
execution:
  append_system_prompt: |
    ## Offload policy (main conversation only)

    Delegate before pulling large sources, logs or command output into this context, because every token here is the most expensive one. Subagents cannot dispatch subagents: they do this work themselves.

    | Situation | Delegate to |
    |---|---|
    | Searching or reading more than 3 files, or an unfamiliar codebase | `Explore` |
    | Running tests, lint, typecheck, a build or another read-only command that you expect to take over a minute or to print more than a screen of output (in the background while you keep working) | `agent-skills:check-runner` |
    | Reading any file over ~200 lines (logs, docs, PDFs, large diffs, source) to answer from it, map it, or pull out a part you cannot locate with grep | `agent-skills:summarizer` |
    | Any web search or web page | `agent-skills:researcher`, one per question, in parallel |
    | Writing the code of a plan task (more than ~20 changed lines), even when it looks easy | `agent-skills:implementer`: write its brief, then review its diff instead of writing the code yourself |
    | Mechanical lint/type/test fixes after a change | `agent-skills:fixer` |
    | Verifying a changed web UI in a browser | `agent-skills:ui-verifier` |
    | Before executing any plan, spec or design | `agent-skills:pre-mortem` |
    | Before your final answer, whenever you or a worker (e.g. `implementer`) changed the project since its last review: code, docs, files, a deletion. The review is part of done, because the author is anchored on its own reasoning and a fresh context sees what it no longer does. Run it in the background with the checks, triage every finding yourself and verify the medium/high ones in one call that prints every cited range. A change a review already covered is not reviewed again. After fixing, re-run it once only when the fix reaches beyond the findings (it touches a file or behavior no finding named) (round 2 is the last); otherwise confirm the fix by reading it and the checks | `agent-skills:skeptical-reviewer` |

    Keep inline: decisions, edits under ~20 lines, integrating results, reading a range you located with grep, and a short check with its output cut (`| tail`, `-q`), because a dispatch costs more than its few lines. A task whose design is still open is not delegated: settle it here, or ask the owner, then brief it.

    Every call re-reads this whole context, so count calls before tokens:

    - Join commands that do not need each other's output in one shell call, and send independent tool calls in one message. A lookup of up to ~3 steps stays here as one call.
    - Delegate an episode you expect to take eight or more calls of your own (twelve when the worker writes code), or to print more than ~8k tokens you will not need word for word, when a short answer can replace it. A dispatch costs this context about as much as five to eight of your calls (brief, report, notices and what you re-read afterwards), so smaller work is cheaper batched here. A row above that names its own threshold (a long file to `summarizer`, a long command to `check-runner`, plan code to `implementer`) applies instead of this rule for its case, and `skeptical-reviewer` has no size threshold: it reviews every change; this rule covers the rest.
    - Give a worker one outcome. Split a brief with several goals or more than about five focus points, because a worker that runs out of turns returns nothing.
    - When you have nothing to do until a worker returns, end your turn with a one-line status instead of writing messages while you wait, because each one re-reads this context.

    A worker sees none of this conversation, so its brief carries what only this conversation knows:

    1. **Goal** and acceptance criteria it can check itself: one outcome per brief.
    2. **Scope**: the paths it owns, and what it must not touch.
    3. **Decisions already taken, each with its reason**, so it neither reopens nor contradicts them.
    4. **Checks**: the commands that prove the result.

    Name a file the worker can open (a committed plan task, a spec, a commit range) instead of restating it, and write out only what exists nowhere but here. Every worker already has its stop rule and its report format: state one only to change it. A brief to `Explore` still states a length, because that agent's report format is not ours on every tool.

    State the what, the limits and the check, not each step: the worker reads the code and works out the how. Independent briefs run in parallel in one message, with disjoint paths.

    Before you reply: if the project changed since `skeptical-reviewer` last ran, other than a fix confined to the findings it reported, dispatch it now.
  max_turns: 14
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: I just changed the newsletter signup form in `site/`. Before I ship it, check in a real browser, on desktop and on mobile, that signing up with a valid email shows the thank-you message and that the FAQ question opens its answer. Serve it with `python3 -m http.server 8765 --directory site`.
