## Preloaded skill: docs-principles

# Documentation Principles

**Core rule:** every sentence carries information that is not cheaper to get elsewhere (code, types, `--help`, git history). Bloat costs reader attention and LLM tokens, and measurably lowers agent task success.

## Principles

| Principle | Meaning |
|---|---|
| Why > what | Code shows what; docs keep intent, constraints, trade-offs |
| Single source of truth | State a fact once and link to it; copies drift |
| Diátaxis | Tutorial, how-to, reference and explanation stay separate |
| LLM-facing text | Wording of prompts, skills and agents follows `prompt-engineering`; cuts to CLAUDE.md/AGENTS.md keep every line that changes behavior |

## References

| Open when | Reference |
|---|---|
| Cutting or tightening any text (workflow step 4) | [density-checklist.md](references/density-checklist.md) |
| Sorting sections by reader need or splitting a mixed section (step 2) | [diataxis.md](references/diataxis.md) |

## Writing rules

- Tables for comparisons and mappings, lists for sequences, prose for reasoning.
- One term per concept; synonyms read as different concepts.
- Prefer one concrete example to an abstract explanation.
- Date time-sensitive facts ("as of 2026-10") so readers can judge staleness.
- Decisions go to ADRs (`decision-records`).
- Apply the density checklist to every paragraph.

## Compression workflow

Copy and tick:

```
- [ ] 1 Inventory: files, lines, ~tokens (chars/4)
- [ ] 2 Classify sections by Diátaxis type; flag mixed ones
- [ ] 3 Verify each claim against code; mark stale/false/unverified
- [ ] 4 Cut with the density checklist
- [ ] 5 Prove nothing lost: each removed fact → where it still lives, or why it was worthless
- [ ] 6 Measure before/after; repeat 3–5 until no item fires
```

## Review output

```markdown
| File:line | Issue (stale · false · duplicate · bloat · mixed-type · missing-why · unverified) | Fix |
Metrics: N lines / ~T tokens → M / ~U (−X%)
Removed facts: fact → still at / reason dropped
```

## Preloaded skill: decision-records

# Decision Records (ADR)

An ADR keeps the **why** that code cannot show: context, rejected options, accepted trade-offs.

## Significance test (write one if any holds)

| Test | Example |
|---|---|
| One-way door: hard or costly to reverse | Database, framework, public API shape |
| Cross-cutting | Error strategy, auth model, module boundaries |
| Surprising to a newcomer | "Why not the obvious library?" |
| Known trade-off accepted | Consistency traded for latency |
| Constraint-driven | Legal, budget, platform limit |

Two-way doors (cheap to reverse) get a commit message, not an ADR.

## Location and naming

Reuse `docs/adr/`, `doc/adr/`, `adr/` or `docs/decisions/`; else create `docs/adr/`. File `NNNN-kebab-title.md`, numbers never reused. To find why an existing decision was made, read these folders first (Context and Alternatives hold the rationale); nothing recorded → say so instead of inferring a rationale.

## Template (≤ 60 lines)

```markdown
# NNNN Title as decision statement

Status: proposed | accepted | superseded by NNNN | deprecated · Date: YYYY-MM-DD

## Context
Forces and constraints. Mark each assumption explicitly.

## Decision
Imperative and specific.

## Alternatives
| Option | Rejected because |

## Consequences
Positive and negative; who or what must change.

## Revisit if
Observable triggers (version, scale, metric, event).
```

Small decisions fit a **Y-statement**: *In the context of `<situation>`, facing `<concern>`, we decided `<option>` and against `<alternatives>`, to achieve `<quality>`, accepting `<downside>`.*

## Rules

- One decision per record, so each can be superseded alone.
- Treat an accepted decision as immutable: changing it means a new ADR that supersedes the old one (only the old status line changes), which keeps the history of reasoning. Verifications and clarifications go in an appended `## Review YYYY-MM-DD` section.
- Write `Revisit if` as observable triggers; staleness audits check them.
- State assumptions explicitly; they are what goes stale first.
- Link code to the ADR where a "cleanup" would undo the decision (`# See ADR 0007`): Chesterton's fence made visible.
- Keep rejected proposals as records; they stop the same debate from restarting.

## Audit

1. **Find** the ADRs (locations above) and note decisions that exist only in code or prose.
2. **Rate** each with the [staleness rubric](references/staleness-rubric.md); open it at this step, because the signals and the aggregation rule live there. The rating is `low | medium | high` plus the signals that fired.
3. **Report** one row per ADR, worst rating first, unless the task sets its own format: `| ADR | Status | Rating | Signals | Action |`, where Action is keep · add a dated Review note · supersede · deprecate.

## Preloaded skill: prompt-engineering

# Prompt engineering

**Core rule:** a model acts only on what is in its context. Write the smallest set of high-signal tokens that makes the wanted behavior likely, give the reason for each non-obvious rule, and prove the change with an eval, not by rereading it.

## References

| Open when | Reference |
|---|---|
| Wording any prompt: instructions, emphasis, examples, format, long context, thinking and effort | [prompt-rules.md](references/prompt-rules.md) |
| Writing a skill, subagent, command or worker brief | [skills-and-agents.md](references/skills-and-agents.md) |
| Designing tools, MCP tool descriptions or structured outputs | [tools.md](references/tools.md) |
| Choosing or writing for a model (Haiku, Sonnet, Opus), or a model change | [models.md](references/models.md) |
| Writing or auditing CLAUDE.md or AGENTS.md | [context-files.md](references/context-files.md) |
| Structuring a repo, specs, plans and docs for agent-run projects; navigating long files | [llm-native-projects.md](references/llm-native-projects.md) |
| Measuring a prompt change (`claude plugin eval`) | [evaluation.md](references/evaluation.md) |

Density cuts follow the `docs-principles` checklist; on LLM-facing text, keep every line that changes behavior (context-files.md audit questions). The authoring *process* for skills (TDD for skills) belongs to Superpowers `writing-skills`.

## Writing or improving

Copy and tick:

```
- [ ] 1 Frame: the reader (model, effort, tools, what it already sees), the wanted behavior, how it will be checked
- [ ] 2 Baseline: run the task without the new text, or read the failing trace; name each failure
- [ ] 3 Draft the minimum that fixes the named failures, with the reference for this artifact
- [ ] 4 Test with every target model; read traces, not only scores
- [ ] 5 Revise: add only for an observed failure; cut lines that changed nothing
- [ ] 6 Record what was measured (ADR, eval, commit), so the next edit does not undo it
```

When no eval is feasible, say the change is unmeasured and name the cheapest check that would measure it.

## Diagnosing a misbehaving prompt

| Symptom | Usual cause | Fix |
|---|---|---|
| Ignores a rule | Rule buried, without a reason, or contradicted elsewhere | One place, near the top, with its reason; remove the conflict |
| Overtriggers or overuses a tool | Emphasis (CAPS, "CRITICAL", "if in doubt, use X") | Calm wording and a specific trigger |
| Skill does not fire | Description lacks the user's terms or a reason to load | "Use when …" with likely terms, plus why loading beats memory |
| Over-engineers or edits when asked to suggest | No scope guard; the verb says "change" | Scope guard; the verb that names the wanted action |
| Stops early, skips steps | Low effort on a small model; no completion criteria | "Done means …"; raise effort for multi-step work |
| Wrong or drifting format | Format only described | 3–5 diverse examples in `<example>` tags |
| Worker improvises or contradicts a decision | Brief lacks decisions, scope or a stop rule | The six-part brief |
| Context fills up | Raw files, logs or command output in the main conversation | Outline and range reads; offload to cheap workers |

## Answering an advice request

1. Diagnose from the text or trace, quoting the lines that cause the behavior.
2. Name the rule and its source, labeled **measured** or **prescribed**.
3. Give a before/after rewrite of only the lines that change.
4. Say how to verify it (an eval case, a trace to read, a model to test).

## Review output

```markdown
| File:line | Rule (reference · measured/prescribed) | Issue | Rewrite | Check |
Unmeasured changes: <list> → cheapest check
```

## Reading long files cheaply

```bash
python3 ${CODEX_HOME:-$HOME/.codex}/plugins/cache/mili-ssm/agent-skills/local/skills/prompt-engineering/scripts/outline.py PATH [PATH...] [--depth N] [--max-entries N]
```

It prints each file's headings and declarations with line ranges, computed by a script, not a model; then read only the range you need (Read with offset and limit). Generate it when needed and never store it, because line numbers go stale with every edit. For logs and other material without structure, dispatch `summarizer` instead.

## Tools

Use only these tools: Read, Grep, Glob, Bash, Edit, Write, Skill. Claude Code enforces this list; Codex does not, so it is your rule.
